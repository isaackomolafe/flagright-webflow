<!--
  Webflow embed: drive per-book CTA card visibility off the Rive "book" data-bound
  number property (ViewModel1 -> book, 1-8), using GSAP for the show/hide transition.

  How the rive file's ViewModel1 -> "book" input works: 1 = book 1 ... 8 = book 8.
  Whenever that number changes (via the file's own autoplay loop or a click on a book),
  this script fades the matching ".press-featured-card.book-N" wrapper in and fades
  every other one out.

  The "book" value flips the instant the rive book-to-book transition *starts*, not
  when it finishes, so the script waits TRANSITION_DELAY seconds (set to match the
  rive file's own transition length) before swapping the CTA - keeping the CTA in
  sync with the slide instead of jumping in early. Update TRANSITION_DELAY near the
  top of the <script> block below if the rive transition timing ever changes.

  Wired for this exact markup:
    <div id="press-hero" class="press-featured-rive">
      <canvas id="press-rive-canvas"></canvas>
    </div>
    <div class="press-featured-card book-1">...</div> ... book-8
  .riv source: https://cdn.prod.website-files.com/64f420094266acf96b6d3f84/6a5c8dcbc665c6e54962b20d_flagright_press_hero.riv

  Setup in Webflow:

  1. Site Settings > Custom Code > Head Code - paste the two <script src> tags below
     once for the whole site (skip if GSAP/Rive are already loaded there).

  2. Page Settings > Custom Code > Before </body> tag (on the page with the Rive
     embed) - paste the <style> + <script> block below as-is, no placeholders left
     to fill in.

  3. Publish the site. Custom code changes do not apply until you publish, even if
     the canvas/CTAs already look right in the Designer/preview.

  4. In Rive, double check "Artboard" has "ViewModel1" set as its default view model
     instance - that's what lets `autoBind: true` pick up the "book" number property
     automatically, with no manual instance wiring. If it isn't the default, the
     console will log "no default view model bound".

  Debugging: open the browser console on the live page. This script logs exactly
  where it stops (canvas missing / no view model / no "book" property / rive load
  error) and logs every book change it applies, so a silent "nothing happens" case
  should no longer be silent.
-->

<!-- ============ 1) Head Code (once per site) ============ -->
<script src="https://unpkg.com/@rive-app/canvas@2.39.0"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<!-- ============ 2) Before </body> tag (this page) ============ -->
<style>
  /* Hide every CTA card until the script decides which one to reveal,
     so all 8 don't flash on load before Rive reports the current book. */
  .press-featured-card {
    opacity: 0;
    pointer-events: none;
  }
</style>

<script>
(function () {
  var CANVAS_ID = "press-rive-canvas";
  var CTA_SELECTOR = ".press-featured-card";
  var TOTAL_BOOKS = 8;
  var RIVE_SRC = "https://cdn.prod.website-files.com/64f420094266acf96b6d3f84/6a5c8dcbc665c6e54962b20d_flagright_press_hero.riv";
  var LOG_PREFIX = "[rive-book-cta]";

  document.addEventListener("DOMContentLoaded", function () {
    if (typeof gsap === "undefined") {
      console.error(LOG_PREFIX, "gsap is not loaded - check the Head Code script tag/order");
      return;
    }
    if (typeof rive === "undefined") {
      console.error(LOG_PREFIX, "rive is not loaded - check the Head Code script tag/order");
      return;
    }

    var canvas = document.getElementById(CANVAS_ID);
    if (!canvas) {
      console.error(LOG_PREFIX, "canvas #" + CANVAS_ID + " not found on this page");
      return;
    }

    var cards = gsap.utils.toArray(CTA_SELECTOR);
    if (!cards.length) {
      console.warn(LOG_PREFIX, "no elements matched " + CTA_SELECTOR + " - CTA cards not found yet?");
    }

    // The rive file's own book-to-book transition takes this long (seconds).
    // The "book" data value flips as soon as that transition *starts*, so we
    // hold off swapping the CTA card until it's actually finished - otherwise
    // the CTA jumps in a beat ahead of the slide it belongs to. Applies the
    // same way whether the transition was triggered by the autoplay loop or
    // a manual click, since both drive the same "book" property.
    var TRANSITION_DELAY = 0.5;

    var current = null;      // book number currently shown on screen
    var pendingTarget = null; // book number queued to show once the delay elapses
    var pendingCall = null;   // gsap.delayedCall for that queued swap

    function applyBook(num) {
      current = num;
      console.log(LOG_PREFIX, "showing book", num);

      cards.forEach(function (card) {
        var isMatch = card.classList.contains("book-" + num);
        gsap.killTweensOf(card);
        gsap.set(card, { pointerEvents: isMatch ? "auto" : "none" });
        gsap.to(card, {
          opacity: isMatch ? 1 : 0,
          duration: isMatch ? 0.4 : 0.3,
          ease: "power1.out"
        });
      });
    }

    function showBook(num, immediate) {
      // Rive can report a transient NaN for a frame or two around a value
      // change - ignore those instead of treating them as "no book selected"
      // (which was hiding every card immediately after it faded in).
      if (typeof num !== "number" || Number.isNaN(num)) return;
      num = Math.min(TOTAL_BOOKS, Math.max(1, Math.round(num)));

      if (immediate) {
        if (pendingCall) pendingCall.kill();
        pendingCall = null;
        pendingTarget = null;
        if (num !== current) applyBook(num);
        return;
      }

      if (num === current || num === pendingTarget) return;

      // A new target book - (re)schedule the swap so the CTA appears in sync
      // with the end of Rive's own transition, not the instant the "book"
      // data value changes. Rescheduling (rather than letting an older timer
      // fire) matters if the value keeps moving before the first one lands.
      pendingTarget = num;
      if (pendingCall) pendingCall.kill();
      pendingCall = gsap.delayedCall(TRANSITION_DELAY, function () {
        pendingCall = null;
        pendingTarget = null;
        applyBook(num);
      });
    }

    var r = new rive.Rive({
      src: RIVE_SRC,
      canvas: canvas,
      autoplay: true,
      stateMachines: "State Machine 1",
      autoBind: true,
      onLoadError: function (err) {
        console.error(LOG_PREFIX, "failed to load .riv file", err);
      },
      onLoad: function () {
        var vmi = r.viewModelInstance;
        if (!vmi) {
          console.error(LOG_PREFIX, "no default view model bound - open the .riv in Rive and set ViewModel1 as the Artboard's default view model");
          return;
        }

        var bookProp = vmi.number("book");
        if (!bookProp) {
          console.error(LOG_PREFIX, 'number property "book" not found on ViewModel1 - check the exact property name/casing');
          return;
        }

        console.log(LOG_PREFIX, "bound to ViewModel1.book, initial value:", bookProp.value);

        // Show whichever book is already active as soon as we bind (covers a
        // mid-loop page load) - no transition delay here, there's no slide
        // animation to wait for on first paint. Every subsequent change (loop
        // or click) goes through the delayed path in showBook().
        showBook(bookProp.value, true);
        // Re-read bookProp.value directly rather than trusting the event
        // payload shape - more reliable across Rive runtime versions.
        bookProp.on(function () {
          showBook(bookProp.value);
        });

        // Belt-and-suspenders: also poll every tick in case this Rive build's
        // .on() observer doesn't fire for changes driven internally by the
        // state machine. showBook() is idempotent (no-ops when unchanged),
        // so this is safe to run alongside the event subscription above.
        gsap.ticker.add(function () {
          showBook(bookProp.value);
        });
      }
    });
  });
})();
</script>
